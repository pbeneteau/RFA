<!doctype html>
<!--
  RFA room console: live web view of a room, served by the hub at /console.

  A plain MCP client in the browser: every action is a modern-era tools/call
  POST to /mcp on the same origin; receiving is a room_listen long-poll loop.
  Join as observer (default, read-only) or supervisor (needs a provisioned
  human key, hub --human-key) for room_admin intervention controls.

  Security: every string from the wire (names, topics, message bodies) is
  agent-controlled and rendered with textContent, never innerHTML.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFA console</title>
<style>
  :root {
    --bg: #101418; --panel: #171d24; --panel-2: #1d242d; --line: #2a3340;
    --text: #d7dee8; --dim: #8494a7; --faint: #5b6b7e;
    --accent: #5aa9e6; --ok: #4cc38a; --busy: #e5b567; --away: #8494a7; --offline: #55606e;
    --danger: #e5484d; --intervene: #b18af8; --human: #f2c94c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.small { font-size: 12px; padding: 2px 8px; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b0f14; font-weight: 600; }
  input, select {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .dim { color: var(--dim); }

  /* ---- join screen ---- */
  #join-screen { max-width: 430px; margin: 9vh auto; padding: 0 16px; }
  #join-screen h1 { font-size: 22px; margin: 0 0 2px; }
  #join-screen .sub { color: var(--dim); margin: 0 0 22px; }
  #join-form { display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  #join-form label { display: grid; gap: 4px; font-size: 12px; color: var(--dim); }
  #join-form input, #join-form select { width: 100%; }
  #join-error { color: var(--danger); font-size: 13px; min-height: 1em; margin: 0; }

  /* ---- app layout ---- */
  #app { display: none; height: 100%; flex-direction: column; }
  #app.on { display: flex; }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header .topic { font-weight: 650; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--dim);
  }
  .chip b { color: var(--text); font-weight: 600; }
  #conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--offline); }
  #conn-dot.live { background: var(--ok); }
  header .grow { flex: 1; }

  main { flex: 1; display: flex; min-height: 0; }

  /* ---- roster ---- */
  #roster {
    width: 280px; flex: none; overflow-y: auto; background: var(--panel);
    border-right: 1px solid var(--line); padding: 10px;
  }
  #roster h2, #floor-panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 4px 4px 8px; }
  .member { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--panel-2); }
  .member .row1 { display: flex; align-items: center; gap: 7px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.ready { background: var(--ok); } .dot.busy { background: var(--busy); }
  .dot.away { background: var(--away); } .dot.offline { background: var(--offline); }
  .member .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 10px; border-radius: 4px; padding: 0 5px; border: 1px solid var(--line); color: var(--dim); flex: none; }
  .badge.supervisor { color: var(--intervene); border-color: var(--intervene); }
  .badge.observer { color: var(--dim); }
  .badge.held { color: var(--danger); border-color: var(--danger); }
  .badge.floor { color: var(--busy); border-color: var(--busy); }
  .badge.human { color: var(--human); border-color: var(--human); }
  .member .detail { font-size: 12px; color: var(--dim); margin: 3px 0 0 16px; overflow-wrap: anywhere; }
  .member .skills { font-size: 11px; color: var(--faint); margin: 2px 0 0 16px; font-family: var(--mono); overflow-wrap: anywhere; }
  .member .actions { display: none; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .member.expanded .actions { display: flex; }
  #floor-panel { margin-top: 14px; }
  #floor-body { font-size: 12px; color: var(--dim); padding: 0 4px; overflow-wrap: anywhere; }

  /* ---- tabs (v0.4.5 workbench) ---- */
  #tabs {
    display: flex; align-items: center; gap: 4px; padding: 6px 12px;
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  #tabs button {
    background: transparent; border: 1px solid transparent; color: var(--dim);
    padding: 5px 14px; border-radius: 6px 6px 0 0; font-size: 13px;
  }
  #tabs button.on { color: var(--text); background: var(--panel); border-color: var(--line); border-bottom-color: var(--panel); font-weight: 600; }
  #tabs .grow { flex: 1; }
  #inbox-badge {
    display: none; background: var(--danger); color: #fff; border-radius: 999px;
    font-size: 10px; padding: 0 6px; margin-left: 4px; font-weight: 700;
  }
  #wb-auth { font-size: 12px; }
  #wb-auth.ok { color: var(--ok); border-color: var(--ok); }
  .tab { display: none; }
  .tab.on { display: block; height: calc(100% - 45px); overflow: hidden; }
  #tab-room.on { display: block; }
  .wb-wrap { height: 100%; overflow-y: auto; padding: 16px 18px; }
  .wb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
  }
  .card h3 { margin: 0 0 4px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .card .desc { color: var(--dim); font-size: 12.5px; margin: 0 0 8px; }
  .kv { font-size: 12px; color: var(--dim); display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .kv b { color: var(--text); font-weight: 600; }
  .card .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .dotgreen { color: var(--ok); } .dotred { color: var(--danger); } .dotgrey { color: var(--faint); }
  #editor-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40;
    align-items: center; justify-content: center;
  }
  #editor-overlay.on { display: flex; }
  #editor-box {
    width: min(860px, 92vw); height: min(640px, 88vh); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; padding: 14px; gap: 8px;
  }
  #editor-text { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font-family: var(--mono); font-size: 12px; padding: 10px; resize: none; }
  #editor-err { color: var(--danger); font-size: 12px; min-height: 1em; }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .panel .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .panel .k { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
  table.runs { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.runs th { text-align: left; color: var(--faint); font-weight: 600; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  table.runs td { padding: 4px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  table.runs tr.click { cursor: pointer; }
  table.runs tr.click:hover td { background: var(--panel-2); }
  .trace-row { font-family: var(--mono); font-size: 12px; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fb-btn { padding: 1px 7px; font-size: 13px; }

  /* ---- graph ---- */
  #graph-wrap { display: none; border-bottom: 1px solid var(--line); background: var(--panel); }
  #graph-wrap.on { display: block; }
  #graph { display: block; width: 100%; height: 280px; }
  #graph-legend { display: flex; gap: 14px; padding: 0 14px 8px; font-size: 11px; color: var(--faint); flex-wrap: wrap; }
  #graph-legend .lg { display: inline-flex; align-items: center; gap: 5px; }
  #graph-legend .sw { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

  /* ---- stream ---- */
  #stream-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stream { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .ev { margin-bottom: 8px; max-width: 100%; }
  .ev .meta { font-size: 11px; color: var(--faint); font-family: var(--mono); }
  .ev-msg { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .ev-msg .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ev-msg .from { font-weight: 650; }
  .kind { font-size: 10px; border-radius: 4px; padding: 0 5px; border: 1px solid var(--line); color: var(--dim); }
  .kind.request { color: var(--accent); border-color: var(--accent); }
  .kind.response { color: var(--ok); border-color: var(--ok); }
  .kind.refuse { color: var(--danger); border-color: var(--danger); }
  .kind.injected { color: var(--intervene); border-color: var(--intervene); }
  .ev-msg .body { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ev-msg .body .json { font-family: var(--mono); font-size: 12px; color: var(--dim); display: block; overflow-x: auto; }
  .ev-line { font-size: 12.5px; color: var(--dim); padding-left: 2px; overflow-wrap: anywhere; }
  .ev-line.intervention { color: var(--intervene); }
  .ev-line.alarm { color: var(--danger); }
  .ev-line.grant { color: var(--busy); }
  .approval { margin-top: 6px; display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .approval .st-pending { color: var(--busy); } .approval .st-approved { color: var(--ok); } .approval .st-rejected { color: var(--danger); }
  #stream-foot {
    display: flex; gap: 8px; align-items: center; padding: 8px 14px;
    background: var(--panel); border-top: 1px solid var(--line);
  }
  #inject-text { flex: 1; }
  #ambient-note { font-size: 12px; color: var(--faint); }
  @media (max-width: 700px) { #roster { display: none; } }
</style>
</head>
<body>

<nav id="tabs">
  <button data-tab="room" class="on">Room</button>
  <button data-tab="agents">Agents</button>
  <button data-tab="runs">Runs</button>
  <button data-tab="inbox">Inbox<span id="inbox-badge"></span></button>
  <span class="grow"></span>
  <button id="wb-auth" title="unlock write actions with the human key">unlock</button>
</nav>

<div id="tab-room" class="tab on">
<div id="join-screen">
  <h1>RFA console</h1>
  <p class="sub">Live view of a room on this hub. Observers watch; supervisors intervene.</p>
  <form id="join-form">
    <label>Room handle <input id="f-room" placeholder="r_XXXXXXXXXX" required autocomplete="off"></label>
    <label>Join secret <input id="f-secret" placeholder="required unless the room is open" autocomplete="off"></label>
    <label>Your name <input id="f-name" value="console" required maxlength="64"></label>
    <label>Role
      <select id="f-role">
        <option value="observer" selected>observer (read-only)</option>
        <option value="supervisor">supervisor (interventions; needs a human key)</option>
      </select>
    </label>
    <label id="f-key-wrap" style="display:none">Human key <input id="f-key" placeholder="hub --human-key value" autocomplete="off"></label>
    <p id="join-error"></p>
    <button type="submit" class="primary">Join room</button>
  </form>
</div>

<div id="app">
  <header>
    <span id="conn-dot" title="listen loop state"></span>
    <span class="topic" id="h-topic"></span>
    <span class="chip mono" id="h-room"></span>
    <span class="chip" id="h-you"></span>
    <span class="chip" id="h-epoch"></span>
    <span class="chip" id="h-mode"></span>
    <span class="grow"></span>
    <select id="h-mode-set" title="set_policy mode (supervisor)" style="display:none">
      <option value="">floor mode...</option>
      <option value="open">open</option>
      <option value="sequential">sequential</option>
      <option value="moderator">moderator</option>
    </select>
    <label class="chip"><input type="checkbox" id="h-graph" checked style="accent-color: var(--accent)"> graph</label>
    <label class="chip"><input type="checkbox" id="h-ambient" checked style="accent-color: var(--accent)"> ambient</label>
    <button id="h-leave" class="danger">Leave</button>
  </header>
  <main>
    <aside id="roster">
      <h2>Roster</h2>
      <div id="roster-list"></div>
      <div id="floor-panel"><h2>Floor</h2><div id="floor-body">open mode: no floor control</div></div>
    </aside>
    <section id="stream-wrap">
      <div id="graph-wrap">
        <canvas id="graph" aria-label="live agent graph"></canvas>
        <div id="graph-legend">
          <span class="lg"><span class="sw" style="background: var(--ok)"></span>ready</span>
          <span class="lg"><span class="sw" style="background: var(--busy)"></span>busy</span>
          <span class="lg"><span class="sw" style="background: var(--offline)"></span>offline</span>
          <span class="lg"><span class="sw" style="background: var(--accent)"></span>request</span>
          <span class="lg"><span class="sw" style="background: var(--ok)"></span>response</span>
          <span class="lg"><span class="sw" style="background: var(--danger)"></span>refuse</span>
          <span class="lg"><span class="sw" style="background: var(--intervene)"></span>intervention</span>
          <span class="lg"><span class="sw" style="background: var(--human)"></span>floor</span>
          <span class="lg"><span class="sw" style="border: 1px solid var(--busy); background: transparent"></span>task dots dock under their owner</span>
        </div>
      </div>
      <div id="stream" aria-live="polite"></div>
      <div id="stream-foot">
        <span id="ambient-note"></span>
        <input id="inject-text" placeholder="inject a message as supervisor... (mention with @name)" style="display:none">
        <button id="inject-send" style="display:none">Inject</button>
      </div>
    </section>
  </main>
</div>
</div>

<div id="tab-agents" class="tab"><div class="wb-wrap"><div id="agents-list" class="wb-grid"></div></div></div>

<div id="tab-runs" class="tab"><div class="wb-wrap">
  <div class="panels" id="runs-panels"></div>
  <div id="runs-table"></div>
  <div id="trace-view" style="margin-top:14px"></div>
</div></div>

<div id="tab-inbox" class="tab"><div class="wb-wrap"><div id="inbox-list" class="wb-grid"></div></div></div>

<div id="editor-overlay"><div id="editor-box">
  <div style="display:flex; gap:8px; align-items:center">
    <b id="editor-title">agent.md</b><span class="grow" style="flex:1"></span>
    <button id="editor-save" class="primary">Save (validates, live-redeploys)</button>
    <button id="editor-close">Close</button>
  </div>
  <textarea id="editor-text" spellcheck="false"></textarea>
  <div id="editor-err"></div>
</div></div>

<script>
"use strict";
// ------------------------------------------------------------------ mcp client
const MCP = "/mcp";
const META = {
  "io.modelcontextprotocol/protocolVersion": "2026-07-28",
  "io.modelcontextprotocol/clientInfo": { name: "rfa-console", version: "0.6.0" },
  "io.modelcontextprotocol/clientCapabilities": {},
};
let rpcId = 0;

async function rpc(method, params, opts = {}) {
  const res = await fetch(MCP, {
    method: "POST",
    keepalive: opts.keepalive ?? false,
    headers: {
      "content-type": "application/json",
      accept: "application/json, text/event-stream",
      "Mcp-Method": method,
      ...(typeof params.name === "string" ? { "Mcp-Name": params.name } : {}),
    },
    body: JSON.stringify({ jsonrpc: "2.0", id: ++rpcId, method, params: { ...params, _meta: META } }),
  });
  const text = await res.text();
  const payload = text.startsWith("event:") || text.includes("\ndata: ")
    ? JSON.parse(text.split("\n").find((l) => l.startsWith("data: ")).slice(6))
    : JSON.parse(text);
  if (payload.error) throw new Error(payload.error.message);
  return payload.result;
}

async function tool(name, args, opts = {}) {
  const result = await rpc("tools/call", { name, arguments: args }, opts);
  let inner;
  try { inner = JSON.parse(result.content[0].text); }
  catch { throw new Error(name + ": non-JSON tool result"); }
  if (result.isError || inner.error) {
    const e = inner.error ?? { code: "error", message: "tool error" };
    const err = new Error(e.message); err.code = e.code; err.data = e.data ?? {};
    throw err;
  }
  return inner;
}

// ------------------------------------------------------------------ state
const S = {
  room: null, token: null, you: null, role: null,
  cursor: 0, epoch: 0, topic: "", policies: null, floor: null,
  roster: [],                     // PresenceRecord[]
  names: new Map(),               // member id -> last known name (incl. departed)
  approvals: new Map(),           // request_id -> {action, requester, status}
  listening: false, stopped: false,
  ambient: true,
};
const $ = (id) => document.getElementById(id);
const nameOf = (id) => S.names.get(id) || id;

// DOM helper: children are appended; strings become TEXT nodes (never HTML).
function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of children) if (c != null) n.append(c);
  return n;
}

// ------------------------------------------------------------------ join / resume
const saveKey = () => "rfa-console:" + ($("#f-room") ? "" : "") + S.room;
$("f-role").addEventListener("change", () => {
  $("f-key-wrap").style.display = $("f-role").value === "supervisor" ? "" : "none";
});
$("join-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("join-error").textContent = "";
  const role = $("f-role").value;
  try {
    const contract = await tool("room_join", {
      room: $("f-room").value.trim(),
      join_secret: $("f-secret").value.trim() || undefined,
      name: $("f-name").value.trim(),
      card: {
        name: $("f-name").value.trim(),
        description: role === "supervisor" ? "human supervisor console" : "read-only console observer",
      },
      role,
      human_key: role === "supervisor" ? ($("f-key").value.trim() || undefined) : undefined,
      history_limit: 200,
    });
    enter(contract.room, contract.you, contract.topic, contract.policies, contract.epoch,
          contract.roster, contract.history.events, contract.history.cursor);
    sessionStorage.setItem("rfa-console:" + contract.room,
      JSON.stringify({ token: contract.you.membership_token, you: contract.you, cursor: 0 }));
  } catch (err) {
    $("join-error").textContent = (err.code ? err.code + ": " : "") + err.message;
  }
});

// Resume a same-tab session if the URL hash names a room we have a token for.
(async function tryResume() {
  const room = location.hash.slice(1);
  if (room) $("f-room").value = room;
  const saved = room && sessionStorage.getItem("rfa-console:" + room);
  if (!saved) return;
  try {
    const { token, you } = JSON.parse(saved);
    S.token = token;
    const r = await tool("room_roster", { room, membership_token: token });
    enter(room, you, r.topic, r.policies, r.epoch, [], r.cursor, r.cursor);
    S.roster = r.roster; renderRoster(); renderFloor(r.floor);
    line("dim", "console reattached (existing membership)");
  } catch { sessionStorage.removeItem("rfa-console:" + room); S.token = null; }
})();

function enter(room, you, topic, policies, epoch, roster, history, cursor) {
  S.room = room; S.token = you.membership_token ?? S.token; S.you = you; S.role = you.role;
  S.topic = topic; S.policies = policies; S.epoch = epoch; S.roster = roster;
  S.cursor = typeof history === "number" ? history : cursor;
  location.hash = room;
  $("join-screen").style.display = "none";
  $("app").classList.add("on");
  $("h-topic").textContent = topic;
  $("h-room").textContent = room;
  $("h-you").append("you: ", el("b", {}, you.name), " (" + you.role + (you.origin === "human" ? ", human" : "") + ")");
  const sup = you.role === "supervisor";
  $("h-mode-set").style.display = sup ? "" : "none";
  $("inject-text").style.display = sup ? "" : "none";
  $("inject-send").style.display = sup ? "" : "none";
  renderHeader(); renderRoster();
  if ($("h-graph").checked) { $("graph-wrap").classList.add("on"); Graph.start(you.id); }
  if (Array.isArray(history)) for (const e of history) renderEvent(e, { replay: true });
  // Seed current task state for the graph (observers may list).
  tool("room_task", { room: S.room, membership_token: S.token, action: "list" })
    .then((r) => Graph.seedTasks(r.tasks ?? []))
    .catch(() => {});
  listenLoop();
}

// ------------------------------------------------------------------ live loop
async function listenLoop() {
  if (S.listening) return;
  S.listening = true;
  while (!S.stopped) {
    try {
      const res = await tool("room_listen", {
        room: S.room, membership_token: S.token,
        since: S.cursor, timeout_ms: 25000, wait_for: "all",
      });
      $("conn-dot").classList.add("live");
      S.cursor = res.cursor;
      for (const e of res.events) renderEvent(e);
      if (res.epoch !== S.epoch) await refreshRoster();
      sessionStorage.setItem("rfa-console:" + S.room,
        JSON.stringify({ token: S.token, you: S.you, cursor: S.cursor }));
    } catch (err) {
      $("conn-dot").classList.remove("live");
      if (err.code === "not_a_member" || err.code === "unknown_room") {
        line("alarm", "membership ended (" + err.code + "); reload to re-join");
        break;
      }
      if (err.code === "room_ended") { line("alarm", "room ended"); break; }
      await new Promise((r) => setTimeout(r, 2500)); // network hiccup: retry
    }
  }
  S.listening = false;
}

async function refreshRoster() {
  const r = await tool("room_roster", { room: S.room, membership_token: S.token });
  S.epoch = r.epoch; S.roster = r.roster; S.policies = r.policies;
  renderHeader(); renderRoster(); renderFloor(r.floor);
}

// ------------------------------------------------------------------ rendering
function renderHeader() {
  $("h-epoch").textContent = "epoch " + S.epoch;
  $("h-mode").textContent = "mode " + (S.policies?.mode ?? "open");
}

function renderRoster() {
  const list = $("roster-list");
  list.replaceChildren();
  for (const m of S.roster) S.names.set(m.id, m.name);
  Graph.setRoster(S.roster);
  const holder = S.floor?.holder;
  for (const m of S.roster) {
    const badges = [el("span", { class: "badge " + m.role }, m.role)];
    if (m.held) badges.push(el("span", { class: "badge held" }, "held"));
    if (holder === m.id) badges.push(el("span", { class: "badge floor" }, "floor"));
    if (m.card_verified === true) badges.push(el("span", { class: "badge" }, "signed"));
    const row = el("div", { class: "member", role: "button", tabindex: "0" },
      el("div", { class: "row1" },
        el("span", { class: "dot " + m.state, title: m.state }),
        el("span", { class: "name", title: m.id }, m.name),
        ...badges),
      m.detail ? el("div", { class: "detail" }, m.detail) : null,
      m.card_summary?.skill_ids?.length ? el("div", { class: "skills" }, m.card_summary.skill_ids.join(" ")) : null,
      supervisorActions(m));
    row.addEventListener("click", (ev) => {
      if (ev.target.tagName !== "BUTTON") row.classList.toggle("expanded");
    });
    list.append(row);
  }
  renderFloor(S.floor);
}

function supervisorActions(m) {
  if (S.role !== "supervisor" || m.id === S.you.id) return null;
  const act = (verb, extra = {}) => async () => {
    try {
      await tool("room_admin", { room: S.room, membership_token: S.token, verb, target: m.id, ...extra });
      await refreshRoster();
    } catch (err) { line("alarm", verb + " failed: " + (err.code ?? "") + " " + err.message); }
  };
  const b = (label, verb, cls = "", extra = {}) =>
    el("button", { class: ("small " + cls).trim(), onclick: act(verb, extra) }, label);
  const wrap = el("div", { class: "actions" });
  wrap.append(
    m.held ? b("release", "release_member") : b("hold", "hold_member"),
    b("interrupt", "interrupt"),
    b("grant floor", "grant_floor"),
    b("evict", "evict", "danger"),
    b("quarantine", "quarantine", "danger"),
  );
  return wrap;
}

function renderFloor(floor) {
  if (floor) S.floor = floor;
  Graph.setFloor(S.floor);
  const f = S.floor;
  const body = $("floor-body");
  if (!f || f.mode === "open") { body.textContent = "open mode: no floor control"; return; }
  body.replaceChildren(
    el("div", {}, "mode: " + f.mode),
    el("div", {}, "holder: ", f.holder ? el("b", {}, nameOf(f.holder)) : "(free)"),
    el("div", {}, "queue: " + (f.queue.length ? f.queue.map(nameOf).join(", ") : "(empty)")),
  );
}

function stamp(e) { return e.ts.slice(11, 19) + " #" + e.seq; }

function line(cls, text, e) {
  const div = el("div", { class: "ev" },
    el("div", { class: "ev-line " + cls }, (e ? stamp(e) + "  " : "") + text));
  appendToStream(div);
}

function renderEvent(e, opts = {}) {
  Graph.onEvent(e, !!opts.replay);
  switch (e.type) {
    case "message": return renderMessage(e);
    case "presence": {
      S.names.set(e.member.id, e.member.name);
      if (!opts.replay) { // live presence also patches the roster in place
        const i = S.roster.findIndex((r) => r.id === e.member.id);
        if (i >= 0) S.roster[i] = e.member; renderRoster();
      }
      if (!S.ambient) return;
      return line("dim", e.member.name + " is " + e.member.state + (e.member.detail ? " (" + e.member.detail + ")" : ""), e);
    }
    case "roster": {
      for (const m of e.members) S.names.set(m.id, m.name);
      if (!opts.replay) { S.roster = e.members; S.epoch = e.epoch; renderHeader(); renderRoster(); }
      return line(e.reason === "evict" ? "alarm" : "dim",
        "roster " + e.reason + ": " + nameOf(e.actor) + " (epoch " + e.epoch + ")", e);
    }
    case "task":
      return line("dim", "task " + e.task.id + " " + e.action + " by " + nameOf(e.actor) +
        ": " + e.task.title + " [" + e.task.state + "]", e);
    case "intervention": {
      if (e.verb === "approve" || e.verb === "reject") {
        const a = S.approvals.get(e.refs?.request_id);
        if (a) { a.status = e.refs.verdict ?? (e.verb === "approve" ? "approved" : "rejected"); a.render?.(); }
      }
      return line("intervention",
        "INTERVENTION " + e.verb + " by " + nameOf(e.actor) +
        (e.target ? " -> " + nameOf(e.target) : "") +
        (e.reason ? " (" + e.reason + ")" : "") +
        (e.refs && Object.keys(e.refs).length ? "  " + JSON.stringify(e.refs) : ""), e);
    }
    case "system": {
      // A clock is not a decision: an approval or hold that ran out must stop
      // showing live buttons and must say it expired, not sit there as pending.
      if (e.event === "approval_expired" || e.event === "hold_expired") {
        const a = S.approvals.get(e.refs?.request_id);
        if (a) { a.status = "expired"; a.render?.(); }
      }
      const cls = e.event === "floor_granted" ? "grant" : (e.event === "gone_quiet" || e.event === "timeout") ? "alarm" : (e.event === "approval_expired" || e.event === "hold_expired") ? "alarm" : "dim";
      return line(cls, e.event + " " + JSON.stringify(e.refs), e);
    }
  }
}

function renderMessage(e) {
  const env = e.envelope;
  S.names.set(env.from.id, env.from.name);
  const head = el("div", { class: "head" },
    el("span", { class: "from" }, env.from.name),
    env.from.origin === "human" ? el("span", { class: "badge human" }, "human") : null,
    el("span", { class: "kind " + env.kind }, env.kind),
    env.ext && env.ext["io.github.pbeneteau/injected"] ? el("span", { class: "kind injected" }, "injected") : null,
    env.chunk ? el("span", { class: "kind" }, "chunk " + env.chunk.index + (env.chunk.final ? " final" : "")) : null,
    el("span", { class: "meta" }, stamp(e) +
      (env.mentions.length ? "  @" + env.mentions.map(nameOf).join(" @") : "") +
      (env.in_reply_to ? "  re:" + env.in_reply_to : "")));
  const body = el("div", { class: "body" });
  for (const part of env.body) {
    if (part.type === "text") body.append(part.text, "\n");
    else if (part.type === "json") body.append(el("span", { class: "json" }, JSON.stringify(part.value)));
    else body.append(el("span", { class: "json" }, "[file " + part.name + " " + part.mime + "]"));
  }
  if (env.refusal) body.append(el("span", { class: "json" },
    "refused: " + env.refusal.reason + (env.refusal.detail ? " (" + env.refusal.detail + ")" : "")));
  const card = el("div", { class: "ev ev-msg" }, head, body);
  const apr = env.ext && env.ext["io.github.pbeneteau/approval"];
  if (apr && typeof apr.request_id === "string") card.append(approvalStrip(apr, env.from.id));
  appendToStream(card);
}

function approvalStrip(apr, requester) {
  const a = S.approvals.get(apr.request_id) ??
    { action: apr.action ?? "", requester, status: "pending" };
  S.approvals.set(apr.request_id, a);
  const status = el("span", {}, "");
  const strip = el("div", { class: "approval" },
    el("span", { class: "badge" }, "approval"),
    el("span", { class: "mono" }, apr.request_id + (a.action ? " (" + a.action + ")" : "")),
    status);
  a.render = () => {
    status.className = "st-" + a.status;
    status.textContent = a.status === "expired" ? "expired (nobody decided in time)" : a.status;
    strip.querySelectorAll("button").forEach((b) => b.remove());
    if (a.status === "pending" && S.role === "supervisor") {
      const decide = (verb) => async () => {
        try { await tool("room_admin", { room: S.room, membership_token: S.token, verb, target: apr.request_id }); }
        catch (err) { line("alarm", verb + " failed: " + (err.code ?? "") + " " + err.message); }
      };
      strip.append(el("button", { class: "small", onclick: decide("approve") }, "approve"),
                   el("button", { class: "small danger", onclick: decide("reject") }, "reject"));
    }
  };
  a.render();
  return strip;
}

function appendToStream(node) {
  const s = $("stream");
  const pinned = s.scrollTop + s.clientHeight >= s.scrollHeight - 60;
  s.append(node);
  while (s.children.length > 1500) s.firstChild.remove(); // bound the DOM
  if (pinned) s.scrollTop = s.scrollHeight;
}

// ------------------------------------------------------------------ live graph
// Canvas view of the room fed by the same listen loop: members on a circle
// (join order), pulses when they talk, decaying who-talks-to-whom edges, task
// dots docked under their owner, ripples for presence/floor/system signals.
const Graph = (() => {
  const wrap = $("graph-wrap");
  const canvas = $("graph");
  const g = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TERMINAL = new Set(["completed", "failed", "cancelled", "rejected"]);
  const C = {};
  const nodes = new Map(); // member id -> {id,name,role,state,held,joined,x,y,tx,ty,gone,goneAt}
  const edges = new Map(); // "a|b" -> {a,b,w,last}
  const tasks = new Map(); // task id -> {id,owner,state,title,x,y,flash,doneAt}
  let pulses = []; // {from,to,t0,dur,color,size}
  let ripples = []; // {id,t0,dur,color}
  let selfId = null;
  let floorHolder = null;
  let hover = null;
  let running = false;
  let raf = 0;
  let lastFrame = 0;

  function theme() {
    const cs = getComputedStyle(document.documentElement);
    for (const [k, v] of Object.entries({
      ok: "--ok", busy: "--busy", away: "--away", offline: "--offline", accent: "--accent",
      danger: "--danger", intervene: "--intervene", human: "--human", dim: "--dim",
      faint: "--faint", line: "--line", text: "--text", node: "--panel-2",
    })) C[k] = cs.getPropertyValue(v).trim();
  }
  const stateColor = (s) => ({ ready: C.ok, busy: C.busy, away: C.away, offline: C.offline })[s] ?? C.dim;
  const kindColor = (k, injected) =>
    injected ? C.intervene : ({ request: C.accent, response: C.ok, refuse: C.danger, status: C.faint }[k] ?? C.dim);
  const taskColor = (s) => ({ submitted: C.faint, working: C.busy, input_required: C.accent, completed: C.ok }[s] ?? C.danger);
  const trunc = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);

  function resize() {
    const dpr = devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(canvas.clientWidth * dpr));
    canvas.height = Math.max(1, Math.round(canvas.clientHeight * dpr));
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
  }
  new ResizeObserver(() => resize()).observe(canvas);

  function layout() {
    const W = canvas.clientWidth, H = canvas.clientHeight;
    const cx = W / 2, cy = H / 2;
    const live = [...nodes.values()].filter((n) => !n.gone);
    live.sort((a, b) => (a.joined ?? "").localeCompare(b.joined ?? "") || a.id.localeCompare(b.id));
    const R = Math.max(56, Math.min(W, H) / 2 - 46);
    live.forEach((n, i) => {
      const ang = -Math.PI / 2 + (2 * Math.PI * i) / live.length;
      n.tx = cx + R * Math.cos(ang);
      n.ty = cy + R * Math.sin(ang);
      if (n.x == null) { n.x = cx; n.y = cy; }
    });
  }

  function setRoster(list) {
    const present = new Set();
    for (const m of list) {
      present.add(m.id);
      const n = nodes.get(m.id) ?? { id: m.id, x: null, y: null };
      Object.assign(n, { name: m.name, role: m.role, state: m.state, held: m.held, joined: m.joined_at, gone: false, goneAt: 0 });
      nodes.set(m.id, n);
    }
    for (const n of nodes.values()) {
      if (!present.has(n.id) && !n.gone) { n.gone = true; n.goneAt = performance.now(); }
    }
    layout();
  }

  function pulse(from, to, color, size = 4) {
    if (pulses.length > 140) pulses.shift();
    pulses.push({ from, to, t0: performance.now(), dur: reduced ? 400 : 900, color, size });
  }
  function ripple(id, color) {
    if (ripples.length > 60) ripples.shift();
    ripples.push({ id, t0: performance.now(), dur: 900, color });
  }
  function bumpEdge(a, b) {
    if (a === b) return;
    const key = a < b ? a + "|" + b : b + "|" + a;
    const e = edges.get(key) ?? { a, b, w: 0 };
    e.w = Math.min(1, e.w + 0.45);
    e.last = performance.now();
    edges.set(key, e);
  }

  function onEvent(e, replay) {
    if (e.type === "task") {
      const t = e.task;
      const cur = tasks.get(t.id) ?? { id: t.id, x: null, y: null };
      const changed = cur.state !== t.state || cur.owner !== t.owner;
      Object.assign(cur, { owner: t.owner, state: t.state, title: t.title });
      if (TERMINAL.has(t.state)) cur.doneAt = cur.doneAt || performance.now();
      if (!replay && changed) cur.flash = performance.now();
      tasks.set(t.id, cur);
      return;
    }
    if (replay) return; // history builds state above; only live events animate
    switch (e.type) {
      case "message": {
        const env = e.envelope;
        const color = kindColor(env.kind, !!(env.ext && env.ext["io.github.pbeneteau/injected"]));
        const targets = env.mentions.filter((id) => nodes.has(id));
        if (targets.length === 0) ripple(env.from.id, color);
        for (const t of targets) { pulse(env.from.id, t, color); bumpEdge(env.from.id, t); }
        return;
      }
      case "presence": {
        const n = nodes.get(e.member.id);
        if (n && n.state !== e.member.state) ripple(e.member.id, stateColor(e.member.state));
        return;
      }
      case "intervention":
        if (e.target && nodes.has(e.target)) { pulse(e.actor, e.target, C.intervene, 5); bumpEdge(e.actor, e.target); }
        else ripple(e.actor, C.intervene);
        return;
      case "system": {
        const r = e.refs ?? {};
        if (e.event === "floor_granted" && typeof r.member === "string") ripple(r.member, C.human);
        if ((e.event === "gone_quiet" || e.event === "timeout") && typeof r.member === "string") ripple(r.member, C.danger);
        return;
      }
    }
  }

  function seedTasks(list) {
    for (const t of list) onEvent({ type: "task", task: t }, true);
  }

  function frame(now) {
    if (!running) return;
    raf = requestAnimationFrame(frame);
    if (document.hidden || !wrap.classList.contains("on")) return;
    const dt = Math.min(64, now - lastFrame || 16);
    lastFrame = now;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    const cx = W / 2, cy = H / 2;
    g.clearRect(0, 0, W, H);
    const k = reduced ? 1 : 1 - Math.exp(-dt / 170);

    // Nodes drift toward their layout slot; departed nodes fade out.
    for (const n of [...nodes.values()]) {
      if (n.gone) {
        if (now - n.goneAt > 1200) {
          nodes.delete(n.id);
          for (const [key, e] of edges) if (e.a === n.id || e.b === n.id) edges.delete(key);
          layout();
        }
        continue;
      }
      n.x += (n.tx - n.x) * k;
      n.y += (n.ty - n.y) * k;
    }
    const pos = (id) => nodes.get(id);

    // Communication edges decay unless refreshed by traffic.
    for (const [key, e] of edges) {
      e.w *= Math.exp(-dt / 45000);
      if (e.w < 0.02) { edges.delete(key); continue; }
      const a = pos(e.a), b = pos(e.b);
      if (!a || !b) continue;
      g.globalAlpha = e.w * 0.5;
      g.strokeStyle = C.dim;
      g.lineWidth = 0.5 + 1.8 * e.w;
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    }
    g.globalAlpha = 1;

    // Unclaimed-task pool in the center.
    const pool = [...tasks.values()].filter((t) => !t.doneAt || now - t.doneAt < 4200);
    const unowned = pool.filter((t) => !t.owner || !nodes.has(t.owner) || nodes.get(t.owner).gone);
    if (unowned.length > 0) {
      g.globalAlpha = 0.5; g.strokeStyle = C.line; g.setLineDash([3, 4]);
      g.beginPath(); g.arc(cx, cy, 26, 0, 2 * Math.PI); g.stroke();
      g.setLineDash([]); g.globalAlpha = 1;
      g.fillStyle = C.faint; g.font = "9px ui-monospace, monospace"; g.textAlign = "center";
      g.fillText("tasks", cx, cy + 40);
    }
    // Task dots: dock under the owner, or orbit the center pool.
    const perOwner = new Map();
    for (const t of pool) {
      const owner = t.owner && nodes.has(t.owner) && !nodes.get(t.owner).gone ? t.owner : null;
      let txx, tyy;
      if (owner) {
        const sibs = perOwner.get(owner) ?? [];
        sibs.push(t); perOwner.set(owner, sibs);
        const i = sibs.length - 1;
        const o = pos(owner);
        txx = o.x + (i - 0.5 * (Math.min(5, sibs.length) - 1)) * 11;
        tyy = o.y + 31;
      } else {
        const i = unowned.indexOf(t);
        const ang = (2 * Math.PI * i) / Math.max(1, unowned.length) - Math.PI / 2;
        txx = cx + 26 * Math.cos(ang); tyy = cy + 26 * Math.sin(ang);
      }
      if (t.x == null) { t.x = cx; t.y = cy; }
      t.x += (txx - t.x) * k; t.y += (tyy - t.y) * k;
      const fade = t.doneAt ? Math.max(0, 1 - Math.max(0, now - t.doneAt - 3400) / 800) : 1;
      g.globalAlpha = fade;
      g.fillStyle = taskColor(t.state);
      g.beginPath(); g.arc(t.x, t.y, 4, 0, 2 * Math.PI); g.fill();
      if (t.flash && now - t.flash < 500) {
        g.globalAlpha = fade * (1 - (now - t.flash) / 500);
        g.strokeStyle = taskColor(t.state); g.lineWidth = 2;
        g.beginPath(); g.arc(t.x, t.y, 4 + 6 * ((now - t.flash) / 500), 0, 2 * Math.PI); g.stroke();
      }
      g.globalAlpha = 1;
      if (t.doneAt && now - t.doneAt > 4200) tasks.delete(t.id);
    }

    // Ripples.
    ripples = ripples.filter((r) => now - r.t0 < r.dur);
    for (const r of ripples) {
      const n = pos(r.id);
      if (!n) continue;
      const t = (now - r.t0) / r.dur;
      g.globalAlpha = (1 - t) * 0.8;
      g.strokeStyle = r.color; g.lineWidth = 2;
      g.beginPath(); g.arc(n.x, n.y, 17 + 24 * t, 0, 2 * Math.PI); g.stroke();
    }
    g.globalAlpha = 1;

    // Message pulses travel along the (moving) endpoints.
    pulses = pulses.filter((p) => now - p.t0 < p.dur);
    for (const p of pulses) {
      const a = pos(p.from), b = pos(p.to);
      if (!a || !b) continue;
      const t = (now - p.t0) / p.dur;
      const e = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; // easeInOut
      if (reduced) {
        g.globalAlpha = 1 - t; g.strokeStyle = p.color; g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
        g.globalAlpha = 1;
        continue;
      }
      const x = a.x + (b.x - a.x) * e, y = a.y + (b.y - a.y) * e;
      const xt = a.x + (b.x - a.x) * Math.max(0, e - 0.08), yt = a.y + (b.y - a.y) * Math.max(0, e - 0.08);
      g.globalAlpha = 0.55; g.strokeStyle = p.color; g.lineWidth = p.size * 0.6;
      g.beginPath(); g.moveTo(xt, yt); g.lineTo(x, y); g.stroke();
      g.globalAlpha = 1; g.fillStyle = p.color;
      g.beginPath(); g.arc(x, y, p.size, 0, 2 * Math.PI); g.fill();
    }

    // Nodes.
    g.font = "10px ui-monospace, monospace"; g.textAlign = "center";
    for (const n of nodes.values()) {
      const alpha = n.gone ? Math.max(0, 1 - (now - n.goneAt) / 1200) : 1;
      if (alpha <= 0) continue;
      g.globalAlpha = alpha;
      const r = 16;
      if (floorHolder === n.id) {
        g.strokeStyle = C.human; g.lineWidth = 2;
        g.beginPath(); g.arc(n.x, n.y, r + 5, 0, 2 * Math.PI); g.stroke();
      }
      if (n.id === selfId) {
        g.globalAlpha = alpha * 0.6; g.strokeStyle = C.accent; g.lineWidth = 1.5;
        g.beginPath(); g.arc(n.x, n.y, r + 8, 0, 2 * Math.PI); g.stroke();
        g.globalAlpha = alpha;
      }
      g.fillStyle = C.node;
      g.beginPath(); g.arc(n.x, n.y, r, 0, 2 * Math.PI); g.fill();
      g.strokeStyle = stateColor(n.state); g.lineWidth = 2.5;
      if (n.role === "observer") g.setLineDash([4, 3]);
      g.beginPath(); g.arc(n.x, n.y, r, 0, 2 * Math.PI); g.stroke();
      g.setLineDash([]);
      if (n.held) {
        g.fillStyle = C.danger;
        g.fillRect(n.x - 4.5, n.y - 5, 3, 10);
        g.fillRect(n.x + 1.5, n.y - 5, 3, 10);
      } else {
        g.fillStyle = stateColor(n.state);
        g.beginPath(); g.arc(n.x, n.y, 4, 0, 2 * Math.PI); g.fill();
      }
      if (n.role === "supervisor") {
        g.fillStyle = C.intervene;
        g.beginPath(); g.arc(n.x + r - 3, n.y - r + 3, 5.5, 0, 2 * Math.PI); g.fill();
        g.fillStyle = C.node; g.font = "bold 8px ui-monospace, monospace";
        g.fillText("S", n.x + r - 3, n.y - r + 6);
        g.font = "10px ui-monospace, monospace";
      }
      g.fillStyle = n.id === selfId ? C.text : C.dim;
      g.fillText(trunc(n.name, 14), n.x, n.y + r + 13);
      g.globalAlpha = 1;
    }

    // Hover inspector.
    if (hover && nodes.has(hover)) {
      const n = nodes.get(hover);
      g.fillStyle = C.text; g.font = "11px ui-monospace, monospace"; g.textAlign = "left";
      g.fillText(`${n.name} · ${n.role} · ${n.state}${n.held ? " · held" : ""}`, 10, 16);
      g.textAlign = "center";
    }
  }

  canvas.addEventListener("mousemove", (ev) => {
    const rect = canvas.getBoundingClientRect();
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    hover = null;
    for (const n of nodes.values()) {
      if (!n.gone && (n.x - mx) ** 2 + (n.y - my) ** 2 < 400) { hover = n.id; break; }
    }
  });
  canvas.addEventListener("mouseleave", () => { hover = null; });

  return {
    start(id) {
      selfId = id ?? selfId;
      theme();
      resize();
      if (!running) { running = true; lastFrame = 0; raf = requestAnimationFrame(frame); }
    },
    stop() { running = false; cancelAnimationFrame(raf); },
    setRoster, onEvent, seedTasks,
    setFloor(f) { floorHolder = f?.holder ?? null; },
  };
})();

$("h-graph").addEventListener("change", () => {
  const on = $("h-graph").checked;
  $("graph-wrap").classList.toggle("on", on);
  if (on && S.token) Graph.start(S.you?.id);
  else Graph.stop();
});

// ------------------------------------------------------------------ controls
$("h-ambient").addEventListener("change", () => {
  S.ambient = $("h-ambient").checked;
  $("ambient-note").textContent = S.ambient ? "" : "ambient presence lines muted";
});

$("h-mode-set").addEventListener("change", async () => {
  const mode = $("h-mode-set").value;
  $("h-mode-set").value = "";
  if (!mode) return;
  try {
    await tool("room_admin", { room: S.room, membership_token: S.token, verb: "set_policy", params: { policies: { mode } } });
    await refreshRoster();
  } catch (err) { line("alarm", "set_policy failed: " + (err.code ?? "") + " " + err.message); }
});

async function injectNow() {
  const text = $("inject-text").value.trim();
  if (!text) return;
  // "@name " prefixes become mentions, resolved against the roster.
  const mentions = [];
  let rest = text;
  for (;;) {
    const m = /^@(\S+)\s+/.exec(rest);
    if (!m) break;
    const member = S.roster.find((r) => r.name === m[1]);
    if (!member) break;
    mentions.push(member.id);
    rest = rest.slice(m[0].length);
  }
  try {
    await tool("room_admin", {
      room: S.room, membership_token: S.token, verb: "inject",
      params: { text: rest, ...(mentions.length ? { mentions } : {}) },
    });
    $("inject-text").value = "";
  } catch (err) { line("alarm", "inject failed: " + (err.code ?? "") + " " + err.message); }
}
$("inject-send").addEventListener("click", injectNow);
$("inject-text").addEventListener("keydown", (ev) => { if (ev.key === "Enter") injectNow(); });

$("h-leave").addEventListener("click", async () => {
  S.stopped = true;
  try { await tool("room_leave", { room: S.room, membership_token: S.token }); } catch {}
  sessionStorage.removeItem("rfa-console:" + S.room);
  location.hash = "";
  location.reload();
});

// Best effort: don't linger in rosters when the tab closes (lease covers the rest).
addEventListener("pagehide", () => {
  if (!S.token || S.stopped) return;
  try { tool("room_leave", { room: S.room, membership_token: S.token }, { keepalive: true }); } catch {}
});

// ------------------------------------------------------------------ workbench (v0.4.5)
// Tabs over the hub's /api/* surface. Reads are tokenless; writes need the
// session token minted from the human key (unlock button, POST /auth).

const WB = {
  token: sessionStorage.getItem("wb_token") || null,
  tab: "room",
  timer: 0,
};

function wbAuthUi() {
  const b = $("wb-auth");
  b.textContent = WB.token ? "unlocked" : "unlock";
  b.classList.toggle("ok", !!WB.token);
}
wbAuthUi();

$("wb-auth").addEventListener("click", async () => {
  if (WB.token) { WB.token = null; sessionStorage.removeItem("wb_token"); wbAuthUi(); return; }
  const key = prompt("human key (hub --human-key value):");
  if (!key) return;
  const r = await fetch("/auth", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ human_key: key.trim() }) });
  if (!r.ok) { alert("invalid key"); return; }
  WB.token = (await r.json()).session_token;
  sessionStorage.setItem("wb_token", WB.token);
  wbAuthUi();
});

async function wb(pathname, opts = {}) {
  const r = await fetch(pathname, {
    method: opts.method ?? "GET",
    headers: {
      ...(opts.body ? { "content-type": "application/json" } : {}),
      ...(WB.token ? { authorization: "Bearer " + WB.token } : {}),
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { WB.token = null; sessionStorage.removeItem("wb_token"); wbAuthUi(); }
  if (!r.ok) throw new Error(data.error ?? r.status);
  return data;
}

for (const btn of document.querySelectorAll("#tabs button[data-tab]")) {
  btn.addEventListener("click", () => {
    WB.tab = btn.dataset.tab;
    document.querySelectorAll("#tabs button[data-tab]").forEach((b) => b.classList.toggle("on", b === btn));
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.id === "tab-" + WB.tab));
    refreshTab();
  });
}

function refreshTab() {
  clearInterval(WB.timer);
  const load = { agents: loadAgents, runs: loadRuns, inbox: loadInbox }[WB.tab];
  if (!load) return;
  void load();
  WB.timer = setInterval(() => void load(), 15_000);
}

// Inbox badge polls regardless of tab.
setInterval(async () => {
  try {
    const approvals = await wb("/api/approvals");
    const b = $("inbox-badge");
    b.style.display = approvals.length ? "inline-block" : "none";
    b.textContent = String(approvals.length);
  } catch { /* hub away */ }
}, 20_000);

// ---- Agents tab ----
async function loadAgents() {
  const agents = await wb("/api/agents");
  const list = $("agents-list");
  list.replaceChildren();
  for (const a of agents) {
    const sup = a.supervisor ?? {};
    const status = sup.status ?? (a.heartbeat_age_s != null && a.heartbeat_age_s < 300 ? "running" : "unknown");
    const dotCls = status === "running" ? "dotgreen" : status === "stopped" ? "dotgrey" : "dotred";
    const life = (action) => async () => {
      try { await wb(`/api/agents/${a.name}/lifecycle`, { method: "POST", body: { action } }); setTimeout(loadAgents, 1200); }
      catch (e) { alert(e.message); }
    };
    const boundRoom = (a.rooms ?? []).find((r) => r.serve)?.room ?? null;
    const askInput = el("input", { placeholder: boundRoom && S.room === boundRoom ? "playground: ask this agent..." : "join its room (Room tab) to use the playground", style: "flex:1; min-width:180px" });
    const askOut = el("div", { class: "desc", style: "white-space:pre-wrap" });
    const doAsk = async () => {
      const q = askInput.value.trim();
      if (!q || !S.token || S.room !== boundRoom) return;
      askOut.textContent = "asking...";
      try {
        const target = S.roster.find((r) => (a.offers ?? []).some((o) => r.card_summary.skill_ids.includes(o)));
        if (!target) throw new Error("agent not in the roster");
        const send = await tool("room_send", {
          room: S.room, membership_token: S.token, message_id: "pg_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          kind: "request", mentions: [target.id], body: [{ type: "text", text: q }],
          reply_by: new Date(Date.now() + 120000).toISOString(),
        });
        let cursor = send.seq;
        for (let i = 0; i < 8; i++) {
          const res = await tool("room_listen", { room: S.room, membership_token: S.token, since: cursor, timeout_ms: 25000 });
          cursor = res.cursor;
          const hit = res.events.find((e) => e.type === "message" && e.envelope.in_reply_to === send.message_id);
          if (hit) {
            const cost = (hit.envelope.body.find((p) => p.type === "json")?.value ?? {}).cost_usd;
            askOut.textContent = hit.envelope.body.filter((p) => p.type === "text").map((p) => p.text).join("\n") + (cost != null ? `\n[$${cost}]` : "");
            return;
          }
        }
        askOut.textContent = "(no reply within the window)";
      } catch (e) { askOut.textContent = "error: " + e.message; }
    };
    askInput.addEventListener("keydown", (ev) => { if (ev.key === "Enter") void doAsk(); });
    list.append(el("div", { class: "card" },
      el("h3", {}, el("span", { class: dotCls }, "\u25CF"), a.name, el("span", { class: "badge" }, a.model + (a.effort ? "/" + a.effort : ""))),
      el("p", { class: "desc" }, a.description),
      el("div", { class: "kv" },
        el("span", {}, "status ", el("b", {}, status)),
        el("span", {}, "def ", el("b", { class: "mono" }, (a.definition_hash ?? "").slice(7, 15))),
        el("span", {}, "heartbeat ", el("b", {}, a.heartbeat_age_s != null ? a.heartbeat_age_s + "s" : "-")),
        el("span", {}, "room ", el("b", { class: "mono" }, boundRoom ?? "-"))),
      el("div", { class: "row" },
        el("button", { class: "small", onclick: () => void openEditor(a.name) }, "edit definition"),
        el("button", { class: "small", onclick: life("restart") }, "restart"),
        status === "stopped"
          ? el("button", { class: "small", onclick: life("start") }, "start")
          : el("button", { class: "small danger", onclick: life("stop") }, "stop")),
      el("div", { class: "row", style: "margin-top:8px" }, askInput, el("button", { class: "small", onclick: () => void doAsk() }, "ask")),
      askOut,
    ));
  }
}

let editorAgent = null;
async function openEditor(name) {
  editorAgent = name;
  const { content } = await wb(`/api/agents/${name}/definition`);
  $("editor-title").textContent = `agents/${name}/agent.md`;
  $("editor-text").value = content;
  $("editor-err").textContent = "";
  $("editor-overlay").classList.add("on");
}
$("editor-close").addEventListener("click", () => $("editor-overlay").classList.remove("on"));
$("editor-save").addEventListener("click", async () => {
  try {
    const r = await wb(`/api/agents/${editorAgent}/definition`, { method: "PUT", body: { content: $("editor-text").value } });
    $("editor-err").textContent = "";
    $("editor-overlay").classList.remove("on");
    line("dim", `definition saved: ${r.definition_hash.slice(0, 15)} (supervisor redeploys)`);
    setTimeout(loadAgents, 1500);
  } catch (e) {
    $("editor-err").textContent = e.message;
  }
});

// ---- Runs tab ----
async function loadRuns() {
  const [summary, runs] = await Promise.all([wb("/api/summary?window_m=60"), wb("/api/runs?limit=30")]);
  const panels = $("runs-panels");
  panels.replaceChildren();
  const panel = (k, v) => el("div", { class: "panel" }, el("div", { class: "v" }, v), el("div", { class: "k" }, k));
  if (summary) {
    panels.append(
      panel("runs / 1h", String(summary.runs)),
      panel("errors", `${summary.errors} (${summary.error_pct.toFixed(0)}%)`),
      panel("avg latency", (summary.avg_latency_ms / 1000).toFixed(1) + "s"),
      panel("cost / 1h", "$" + summary.cost_usd.toFixed(3)),
      panel("avg feedback", summary.avg_feedback == null ? "-" : summary.avg_feedback.toFixed(2)),
    );
  }
  const tbl = el("table", { class: "runs" },
    el("tr", {}, ...["", "run", "type", "status", "latency", "cost", "room", ""].map((h) => el("th", {}, h))));
  for (const r of runs) {
    const fb = async (score) => {
      try { await wb("/api/feedback", { method: "POST", body: { run_id: r.id, key: "thumbs", score } }); loadRuns(); }
      catch (e) { alert(e.message); }
    };
    const row = el("tr", { class: "click" },
      el("td", {}, el("span", { class: r.status === "error" ? "dotred" : "dotgreen" }, "\u25CF")),
      el("td", { class: "mono" }, r.name + " " + r.id.slice(0, 10)),
      el("td", {}, r.run_type.replace("_span", "")),
      el("td", {}, r.status + (r.needs_review ? " (review)" : "")),
      el("td", {}, ((r.end_time - r.start_time) / 1000).toFixed(1) + "s"),
      el("td", {}, r.cost_usd != null ? "$" + r.cost_usd.toFixed(4) : "-"),
      el("td", { class: "mono" }, r.group_id ?? "-"),
      el("td", {},
        el("button", { class: "small fb-btn", onclick: (ev) => { ev.stopPropagation(); void fb(1); } }, "\uD83D\uDC4D"),
        " ",
        el("button", { class: "small fb-btn", onclick: (ev) => { ev.stopPropagation(); void fb(0); } }, "\uD83D\uDC4E")),
    );
    row.addEventListener("click", () => void loadTrace(r.trace_id));
    tbl.append(row);
  }
  $("runs-table").replaceChildren(tbl);
}

async function loadTrace(traceId) {
  const runs = await wb("/api/runs?trace=" + encodeURIComponent(traceId));
  const view = $("trace-view");
  view.replaceChildren(el("h3", {}, "trace ", el("span", { class: "mono" }, traceId.slice(0, 16))));
  for (const r of runs) {
    const depth = r.dotted_order.split(".").length - 1;
    view.append(el("div", { class: "trace-row", style: `padding-left:${depth * 22}px; color:${r.status === "error" ? "var(--danger)" : "var(--text)"}` },
      `${r.name}  ${((r.end_time - r.start_time) / 1000).toFixed(2)}s` +
      (r.cost_usd != null ? `  $${r.cost_usd.toFixed(4)}` : "") +
      (r.error ? `  ${r.error}` : "")));
  }
}

// ---- Inbox tab ----
async function loadInbox() {
  const approvals = await wb("/api/approvals");
  const list = $("inbox-list");
  list.replaceChildren();
  if (!approvals.length) list.append(el("p", { class: "desc" }, "no pending approvals"));
  for (const a of approvals) {
    const paramsBox = el("input", { placeholder: "params override (JSON, optional = edit-before-approve)", style: "width:100%" });
    const decide = (verb) => async () => {
      let params;
      if (paramsBox.value.trim()) {
        try { params = JSON.parse(paramsBox.value); } catch { alert("params must be JSON"); return; }
      }
      try { await wb("/api/approvals/decide", { method: "POST", body: { room: a.room, request_id: a.request_id, verb, params } }); loadInbox(); }
      catch (e) { alert(e.message); }
    };
    const canEdit = !a.allowed_decisions || a.allowed_decisions.includes("edit");
    list.append(el("div", { class: "card" },
      el("h3", {}, a.held ? "held message" : "approval", el("span", { class: "badge" }, a.action || "-")),
      el("p", { class: "desc" }, `${a.requester_name} in ${a.topic}`),
      a.message_preview ? el("p", { class: "desc", style: "font-style:italic" }, '"' + a.message_preview + '"') : null,
      el("div", { class: "kv" },
        el("span", { class: "mono" }, a.request_id),
        a.expires_at ? el("span", {}, "expires ", el("b", {}, a.expires_at.slice(11, 19))) : null,
        a.allowed_decisions ? el("span", {}, "allows ", el("b", {}, a.allowed_decisions.join("/"))) : null),
      canEdit && !a.held ? paramsBox : null,
      el("div", { class: "row", style: "margin-top:8px" },
        el("button", { class: "small primary", onclick: decide("approve") }, a.held ? "release" : "approve"),
        el("button", { class: "small danger", onclick: decide("reject") }, "reject")),
    ));
  }
}
